<!DOCTYPE html>
<!--
  Share card (public/og.png), 1200 × 630. A static render of the home hero, not
  generated at build time: re-render it whenever the headline, photo or wordmark
  changes. Open this file from its own folder (image paths are relative to tools/)
  and screenshot the page at exactly 1200 × 630.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    display: grid;
    grid-template-columns: 640px 1fr;
    background: #151515;
    color: #eef1ec;
    font-family: 'Archivo', Arial, sans-serif;
    overflow: hidden;
  }
  .copy {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 0 56px 64px;
  }
  .mark {
    height: 30px;
    width: auto;
    align-self: flex-start;
    filter: brightness(0) invert(1);
  }
  h1 {
    font-weight: 800;
    font-variation-settings: 'wdth' 108;
    font-size: 86px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-right: -120px;
  }
  h1 em { font-style: normal; color: #ceff00; }
  .photo { position: relative; overflow: hidden; }
  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 40% 60%;
  }
  .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(21, 21, 21, 0.75) 0%, rgba(21, 21, 21, 0) 38%),
      linear-gradient(0deg, rgba(21, 21, 21, 0.55), rgba(21, 21, 21, 0) 40%);
  }
  .meta {
    position: absolute;
    right: 48px;
    bottom: 44px;
    z-index: 3;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.8;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="copy">
    <img class="mark" src="../public/brand/parteli-wordmark-tight.png" alt="Parteli">
    <h1>Where the<br>future of<br><em>powersports</em><br>gets built.</h1>
  </div>
  <div class="photo"><img src="../public/photos/hero-cliff.webp" alt=""></div>
  <div class="meta">Real riders<br>Real backcountry</div>
</body>
</html>
