<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Chakra+Petch:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #080906;
    color: #f3f2ea;
    font-family: 'Archivo', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .checker {
    height: 18px;
    flex: none;
    background-image:
      linear-gradient(45deg, #c8e81f 25%, transparent 25%, transparent 75%, #c8e81f 75%),
      linear-gradient(45deg, #c8e81f 25%, transparent 25%, transparent 75%, #c8e81f 75%);
    background-size: 18px 18px;
    background-position: 0 0, 9px 9px;
    background-color: #080906;
  }
  .checker.red {
    background-image:
      linear-gradient(45deg, #ff3417 25%, transparent 25%, transparent 75%, #ff3417 75%),
      linear-gradient(45deg, #ff3417 25%, transparent 25%, transparent 75%, #ff3417 75%);
  }
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
  }
  .left { flex: 1; min-width: 0; }
  .mark { height: 58px; width: auto; display: block; }
  h1 {
    margin-top: 40px;
    font-family: 'Chakra Petch', sans-serif;
    font-style: italic;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 72px;
    line-height: 0.94;
    letter-spacing: -0.028em;
  }
  h1 em { font-style: inherit; color: #c8e81f; }
  .sub {
    margin-top: 28px;
    font-size: 22px;
    line-height: 1.45;
    color: #9b9d8c;
    max-width: 30ch;
  }
  .plateBody {
    position: relative;
    height: 190px;
    display: grid;
    place-items: center;
  }
  .pack { display: grid; width: 430px; flex: none; justify-items: center; }
  .machine { width: 300px; }
  .m1 { color: #c8e81f; justify-self: start; }
  .m2 { color: #7d8f16; justify-self: end; margin-top: -11%; }
  .m3 { color: #47500f; justify-self: start; margin-top: -11%; }
  .rv { font-size: 15px; color: #9b9d8c; }
</style>
</head>
<body>
  <div class="checker"></div>
  <div class="body">
    <div class="left">
      <img class="mark" src="WORDMARK_SRC" alt="Parteli">
      <h1>Many riders<br>Many dealers<br><em>One system</em></h1>
      <p class="sub">For independent powersports shops.</p>
    </div>

    <div class="pack">
      <svg class="machine m1" viewBox="0 0 130 62" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="42" r="14"/><circle cx="106" cy="42" r="14"/>
        <circle cx="24" cy="42" r="4"/><circle cx="106" cy="42" r="4"/>
        <path d="M30 21 L59 19 L75 17 L83 22 L86 27 L70 28 L67 38 L55 38 L54 29 L45 26 Z"/>
        <path d="M24 42 L55 36"/><path d="M86 27 L106 42"/><path d="M85 24 L89 15"/>
        <path d="M82 13 L98 16"/><path d="M90 29 L103 26"/>
        <path d="M69 33 C 78 34 82 30 87 31"/>
      </svg>
      <svg class="machine m2" viewBox="0 0 130 62" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="25" cy="43" r="14"/><circle cx="105" cy="43" r="14"/>
        <circle cx="25" cy="43" r="4"/><circle cx="105" cy="43" r="4"/>
        <path d="M35 25 L60 23 L78 21 L85 26 L87 31 L72 31 L69 40 L57 40 L56 31 L48 28 Z"/>
        <path d="M25 43 L57 38"/><path d="M87 31 L105 43"/><path d="M87 27 L99 29"/>
        <path d="M85 22 L92 26"/><path d="M92 36 L104 33"/>
        <path d="M71 36 C 80 37 86 35 90 36"/>
      </svg>
      <svg class="machine m3" viewBox="0 0 130 62" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="30" cy="44" r="14"/><circle cx="100" cy="44" r="14"/>
        <circle cx="30" cy="44" r="4"/><circle cx="100" cy="44" r="4"/>
        <path d="M13 44 L14 33 L24 31 L38 30 L47 17 L84 17 L92 30 L116 33 L117 44"/>
        <path d="M47 17 L54 30 L86 30"/><path d="M66 17 L66 30"/>
        <path d="M54 30 L52 37 L88 37 L86 30"/><path d="M16 36 L24 31"/>
        <path d="M92 30 L95 37"/>
      </svg>
    </div>
  </div>
  <div class="checker red"></div>
</body>
</html>
